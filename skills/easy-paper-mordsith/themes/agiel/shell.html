<div class="agiel">
  <div class="agiel-frame">
    <header class="agiel-masthead">
      <a class="agiel-brand" href="#overview"><span class="agiel-mark" aria-hidden="true"></span> AGIEL</a>
      <div class="agiel-switches"><button type="button" data-agiel-motion aria-pressed="true">Motion on</button><button type="button" data-agiel-sound aria-pressed="false">Sound off</button></div>
    </header>
    <div class="agiel-stage">
      {{HERO}}
      <section class="agiel-exhibit" aria-labelledby="agiel-exhibit-title">
        <div class="agiel-exhibit-bar"><h2 id="agiel-exhibit-title">Evidence scanner</h2><span class="agiel-position"></span></div>
        <div class="agiel-diagram" data-scan="0" aria-hidden="true"><canvas></canvas><span class="agiel-register"></span></div>
        <div class="agiel-scan-controls" role="group" aria-label="Evidence scanner topics"></div>
        <p class="agiel-scan-readout" aria-live="polite"></p>
      </section>
    </div>
    {{NAV}}
    {{PANELS}}
    {{FOOTER}}
  </div>
  {{INTRO}}
</div>
